# Paste inside the existing "server { listen 443 ssl; ... }" block of the site,
# before "location / { return 404; }".
    location = /agent/mcp {
        access_log off;   # Bee Memory: no request log for agent traffic
        limit_req zone=p100 burst=10 nodelay;
        proxy_pass http://127.0.0.1:5200/mcp;
        proxy_read_timeout 200s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /agent/v1/ {
        access_log off;
        limit_req zone=p100 burst=10 nodelay;
        proxy_pass http://127.0.0.1:5200/v1/;
        proxy_read_timeout 200s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /agent/llms.txt {
        alias /var/www/agentwallet/llms.txt;
        default_type text/plain;
        charset utf-8;
    }
